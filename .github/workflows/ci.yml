name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: crawler, POSTGRES_PASSWORD: crawler, POSTGRES_DB: crawler }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawler" --health-interval 5s --health-retries 20
      typesense:
        image: typesense/typesense:29.0
        env: { TYPESENSE_API_KEY: croissant-dev-key, TYPESENSE_DATA_DIR: /tmp }
        ports: ["8108:8108"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -v
        env:
          TYPESENSE_URL: http://localhost:8108
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t croissant-crawler:ci .
