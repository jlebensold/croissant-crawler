# Croissant Crawler: the whole stack on one machine.
#   docker compose up -d            # start everything
#   open http://localhost:8000      # web UI (search, graph, crawl dashboard, validator)
#   open http://localhost:8233      # Temporal UI (workflow history)
name: croissant-crawler

x-app: &app
  build: .
  image: croissant-crawler:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://crawler:crawler@postgres:5432/crawler
    TYPESENSE_URL: http://typesense:8108
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-croissant-dev-key}
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:8233}
  depends_on:
    postgres: { condition: service_healthy }
    typesense: { condition: service_healthy }
    temporal: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 3s
      retries: 30

  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-croissant-dev-key}", "--enable-cors"]
    volumes: [tsdata:/data]
    ports: ["${TYPESENSE_HOST_PORT:-8108}:8108"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 3s
      retries: 40

  temporal:
    # Single-binary Temporal dev server with SQLite persistence: no Elasticsearch/Cassandra needed.
    image: temporalio/temporal:1.10.0
    restart: unless-stopped
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db",
              "--ui-port", "8233", "--namespace", "default", "--log-level", "warn"]
    volumes: [temporaldata:/data]
    ports: ["${TEMPORAL_HOST_PORT:-7233}:7233", "${TEMPORAL_UI_HOST_PORT:-8233}:8233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      retries: 40

  worker:
    <<: *app
    command: ["croissant-crawler", "worker"]
    stop_grace_period: 45s   # lets in-flight activities drain (worker grace is 30s)

  web:
    <<: *app
    command: ["croissant-crawler", "web", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${WEB_HOST_PORT:-8000}:8000"]

volumes:
  pgdata:
  tsdata:
  temporaldata:
